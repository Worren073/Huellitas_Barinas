services:
  # Redis Cache & Celery Broker
  - type: redis
    name: huellitas-redis
    plan: free
    region: virginia
    ipAllowList: []
  # Django API Server
  - type: web
    name: huellitasvenezuela-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildCommand: pip install -r requirements.txt
    dockerCommand: ./entrypoint.sh gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 3 --timeout 120
    healthCheckPath: /api/health/
    plan: free
    region: virginia
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        scope: runtime
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: huellitasvenezuela-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: huellitas-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: huellitas-redis
          type: redis
          property: connectionString
      # Email Configuration
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Huellitas Barinas <noreply@huellitasbarinas.com>"
      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://huellitasvenezuela-web.onrender.com
      # Run migrations on API container
      - key: RUN_MIGRATIONS
        value: "true"
      # Frontend API URL
      - key: NEXT_PUBLIC_API_URL
        value: https://huellitasvenezuela-api.onrender.com
      # Monitoring
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
  # Next.js Frontend
  - type: web
    name: huellitasvenezuela-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    buildCommand: npm run build
    healthCheckPath: /
    plan: free
    region: virginia
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://huellitasvenezuela-api.onrender.com
      - key: API_SERVER_URL
        value: https://huellitasvenezuela-api.onrender.com
      - key: NODE_ENV
        value: production
# Environment: Production
# Autoscaling: Not available on free tier
databases:
  - name: huellitasvenezuela-db
    plan: free
    region: virginia
# Backups: pg_dump before DB expires (30-day free tier)
# Monitoring: Sentry (optional, set SENTRY_DSN)
# Logging: Check Render logs dashboard
